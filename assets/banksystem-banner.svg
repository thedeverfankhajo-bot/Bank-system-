<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BankSystem project banner</title>
  <desc id="desc">Illustrative project graphic for a PocketMine-MP banking plugin, not an in-game screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a35"/>
      <stop offset="1" stop-color="#173c58"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203957"/>
      <stop offset="1" stop-color="#132940"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="150" fill="#21d4c2" opacity=".08"/>
  <circle cx="1130" cy="300" r="210" fill="#56a6ff" opacity=".08"/>
  <path d="M70 90h64l32 32-32 32H70z" fill="#4ee0ce" opacity=".95"/>
  <path d="M88 122h44M110 100v44" stroke="#102339" stroke-width="8" stroke-linecap="round"/>
  <text x="70" y="215" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="800" letter-spacing="1">BankSystem</text>
  <text x="72" y="254" fill="#b9d1e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Banking and wallet plugin for PocketMine-MP API 5</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
    <rect x="72" y="282" width="142" height="30" rx="15" fill="#214d5b"/><text x="143" y="302" text-anchor="middle" fill="#a9fff1">SQLITE STORAGE</text>
    <rect x="224" y="282" width="154" height="30" rx="15" fill="#214d5b"/><text x="301" y="302" text-anchor="middle" fill="#a9fff1">PLAYER TRANSFERS</text>
    <rect x="388" y="282" width="151" height="30" rx="15" fill="#214d5b"/><text x="463" y="302" text-anchor="middle" fill="#a9fff1">API 5 COMPATIBLE</text>
  </g>
  <g transform="translate(690 38)">
    <rect x="0" y="0" width="430" height="282" rx="22" fill="url(#card)" stroke="#456681" stroke-width="1.5"/>
    <text x="28" y="38" fill="#b6cde1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">ACCOUNT OVERVIEW</text>
    <text x="28" y="82" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Available wallet</text>
    <text x="28" y="115" fill="#4ee0ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">125.00</text>
    <rect x="270" y="62" width="125" height="64" rx="14" fill="#285368"/>
    <path d="M294 89h22m-11-11v22" stroke="#8ef8e9" stroke-width="4" stroke-linecap="round"/>
    <text x="327" y="91" fill="#d9fff9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">TRANSFER</text>
    <text x="327" y="108" fill="#d9fff9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">READY</text>
    <line x1="28" y1="143" x2="402" y2="143" stroke="#456681"/>
    <circle cx="43" cy="178" r="10" fill="#4ee0ce"/>
    <text x="64" y="183" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Bank balance</text>
    <text x="392" y="183" text-anchor="end" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">840.00</text>
    <circle cx="43" cy="216" r="10" fill="#56a6ff"/>
    <text x="64" y="221" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Transaction history</text>
    <text x="392" y="221" text-anchor="end" fill="#b9d1e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">PAGED</text>
    <text x="28" y="258" fill="#91adc5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Illustrative project graphic — not a live game screenshot</text>
  </g>
</svg>
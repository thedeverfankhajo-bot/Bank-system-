name: PocketMine runtime smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocketmine-startup:
    name: Load plugin on PocketMine-MP 5.44.3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify PocketMine-MP server PHAR
        env:
          PMMP_PHAR_SHA256: d8b4d87a64124d83659f629c87d6a8e0e142192f6c719fe4684272ff44105539
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/PocketMine-MP.phar" \
            "https://github.com/pmmp/PocketMine-MP/releases/download/5.44.3/PocketMine-MP.phar"
          echo "$PMMP_PHAR_SHA256  $RUNNER_TEMP/PocketMine-MP.phar" | sha256sum --check

      - name: Download and verify the recommended PocketMine PHP 8.2 runtime
        env:
          PMMP_PHP_SHA256: 000fc605878d24be3d6faa6991c0d3a39ae90a0f9ff24d9f4e4722ef823082fc
        run: |
          mkdir -p "$RUNNER_TEMP/pmmp-php"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$RUNNER_TEMP/pmmp-php.tar.gz" \
            "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-latest/PHP-8.2-Linux-x86_64-PM5.tar.gz"
          echo "$PMMP_PHP_SHA256  $RUNNER_TEMP/pmmp-php.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pmmp-php.tar.gz" -C "$RUNNER_TEMP/pmmp-php"
          PHP_BIN="$(find "$RUNNER_TEMP/pmmp-php" -type f -path '*/bin/php' -executable -print -quit)"
          test -n "$PHP_BIN"
          "$PHP_BIN" --version
          echo "PMMP_PHP_BIN=$PHP_BIN" >> "$GITHUB_ENV"

      - name: Build BankSystem PHAR
        run: php -d phar.readonly=0 tools/build-phar.php "$RUNNER_TEMP/BankSystem.phar"

      - name: Boot PocketMine and verify plugin initialization
        shell: bash
        run: |
          set -euo pipefail
          SERVER_DIR="$RUNNER_TEMP/pmmp-server"
          DATA_DIR="$SERVER_DIR/data"
          PLUGIN_DIR="$SERVER_DIR/plugins"
          OUTPUT_LOG="$SERVER_DIR/console.log"
          mkdir -p "$DATA_DIR" "$PLUGIN_DIR" "$DATA_DIR/players"

          # Seed valid PocketMine player NBT for the offline-account integration test.
          python3 - "$DATA_DIR/players/offsmoketarget.dat" <<'PY'
          import struct
          import sys
          import zlib

          tag_name = b"LastKnownXUID"
          xuid = b"1234567890123"
          nbt = (
              b"\x0a\x00\x00"
              + b"\x08"
              + struct.pack(">H", len(tag_name)) + tag_name
              + struct.pack(">H", len(xuid)) + xuid
              + b"\x00"
          )
          with open(sys.argv[1], "wb") as player_data:
              player_data.write(zlib.compress(nbt))
          PY

          cp "$RUNNER_TEMP/PocketMine-MP.phar" "$SERVER_DIR/PocketMine-MP.phar"
          cp "$RUNNER_TEMP/BankSystem.phar" "$PLUGIN_DIR/BankSystem.phar"
          mkfifo "$SERVER_DIR/console-input"
          cd "$SERVER_DIR"

          "$PMMP_PHP_BIN" "$SERVER_DIR/PocketMine-MP.phar" \
            --no-wizard --disable-ansi \
            --data="$DATA_DIR" --plugins="$PLUGIN_DIR" \
            < "$SERVER_DIR/console-input" > "$OUTPUT_LOG" 2>&1 &
          SERVER_PID=$!
          cleanup(){
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          exec 3>"$SERVER_DIR/console-input"
          READY=0
          for attempt in $(seq 1 60); do
            if grep -q "BankSystem enabled. SQLite storage is ready." "$DATA_DIR/server.log" 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$OUTPUT_LOG"
              cat "$DATA_DIR/server.log" 2>/dev/null || true
              echo "PocketMine exited before BankSystem initialized." >&2
              exit 1
            fi
            sleep 1
          done

          cat "$OUTPUT_LOG"
          cat "$DATA_DIR/server.log" 2>/dev/null || true
          if [ "$READY" -ne 1 ]; then
            echo "BankSystem did not initialize within 60 seconds." >&2
            exit 1
          fi
          test -f "$DATA_DIR/plugin_data/BankSystem/bank.sqlite3"
          grep -q "Enabling BankSystem v1.0.0" "$DATA_DIR/server.log"

          # Exercise offline lookup, account creation, an admin mutation, and the ledger commit.
          printf 'bank admin give OffSmokeTarget bank 1.00\n' >&3
          OFFLINE_OK=0
          DB_PATH="$DATA_DIR/plugin_data/BankSystem/bank.sqlite3"
          for attempt in $(seq 1 30); do
            if "$PMMP_PHP_BIN" -r '
              $db = new SQLite3($argv[1]);
              $row = $db->querySingle("SELECT uuid, bank_balance FROM bank_accounts WHERE xuid = \\'1234567890123\\'", true);
              $count = (int) $db->querySingle("SELECT COUNT(*) FROM bank_transactions WHERE action = \\'admin_give_bank\\' AND to_uuid = \\'offline-xuid:1234567890123\\'");
              $db->close();
              exit($row !== false && $row["uuid"] === "offline-xuid:1234567890123" && (int) $row["bank_balance"] === 100 && $count === 1 ? 0 : 1);
            ' "$DB_PATH"; then
              OFFLINE_OK=1
              break
            fi
            sleep 1
          done
          if [ "$OFFLINE_OK" -ne 1 ]; then
            cat "$OUTPUT_LOG"
            cat "$DATA_DIR/server.log" 2>/dev/null || true
            echo "Offline XUID-backed account creation or ledger verification failed." >&2
            exit 1
          fi

          printf 'stop\n' >&3
          exec 3>&-
          wait "$SERVER_PID"
          trap - EXIT

      - name: Upload validated BankSystem plugin PHAR
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BankSystem-API5-PHAR
          path: ${{ runner.temp }}/BankSystem.phar
          if-no-files-found: error
          retention-days: 14

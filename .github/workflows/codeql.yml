name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PHP and GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: php, actions
          build-mode: none
          queries: +security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:php-and-actions"
          output: ${{ runner.temp }}/codeql-results
          # Private repositories need GitHub Code Security enabled to upload scan alerts.
          # Set the repository Actions variable CODEQL_UPLOAD_RESULTS to the string "true"
          # only after Code Security is enabled; otherwise keep SARIF as a workflow artifact.
          upload: ${{ vars.CODEQL_UPLOAD_RESULTS == 'true' && 'always' || 'never' }}

      - name: Archive CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: warn
          retention-days: 14

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: +security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
          output: ${{ runner.temp }}/codeql-results
          upload-database: false
          # Private repositories need GitHub Code Security enabled to upload scan alerts.
          # Set CODEQL_UPLOAD_RESULTS to the string "true" only after Code Security is enabled.
          # Otherwise, keep SARIF as a workflow artifact.
          upload: ${{ vars.CODEQL_UPLOAD_RESULTS == 'true' && 'always' || 'never' }}

      - name: Archive CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sqlite3
          coverage: none

      - name: Validate Composer manifest
        run: |
          COMPOSER_ROOT_VERSION="$(ruby -e 'require "yaml"; puts YAML.load_file("plugin.yml")["version"]')"
          export COMPOSER_ROOT_VERSION
          printf 'Composer root version: %s\n' "$COMPOSER_ROOT_VERSION"
          composer validate --strict --no-check-publish --no-check-all

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit resolved dependencies
        run: composer audit

      - name: Run unit and SQLite tests
        run: composer test

      - name: Lint PHP files
        run: composer lint

      - name: Validate YAML files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "#{file}: OK" }' plugin.yml resources/config.yml .github/workflows/ci.yml .github/workflows/codeql.yml .github/dependabot.yml .github/workflows/pocketmine-smoke.yml .github/workflows/php-security.yml

  windows-acl-script:
    name: Validate Windows ACL script syntax
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/harden-windows-acl.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell syntax OK'

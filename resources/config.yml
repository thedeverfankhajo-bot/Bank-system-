storage:
  # Disabled by default for compatibility with standard PocketMine PHP builds.
  # Set true only when PHP's sqlite3 extension is compiled with SQLCipher support.
  # Provide BANKSYSTEM_SQLCIPHER_KEY through the server process environment (32+ bytes).
  # Enabling this on an existing plaintext database requires offline SQLCipher migration.
  encryption-at-rest: false

currency:
  # Displayed before all amounts.
  symbol: "$"

balances:
  # Applied only when a player's account is first created. Keep these quoted.
  initial-wallet: "0.00"
  initial-bank: "0.00"

limits:
  # Maximum amount accepted by a single deposit, withdrawal, transfer, give, take, or balance-set delta.
  max-transaction: "1000000.00"

security:
  # Cooldown between successful money-changing commands. Set to 0 to disable.
  transaction-cooldown-seconds: 1

history:
  # Number of entries displayed per page.
  entries-per-page: 10
